_target_: nimrod.models.lm.NNLM_X
_partial_: true
num_classes: 67

nnet:
  _target_: nimrod.models.lm.NNLM
  n_vocab: ${num_classes}
  n_emb: 10
  n_context: 3
  n_h: 100
  batch_norm: false # set true to add batchnorm on the hidden layer

# optimizer & scheduler come from config/optimizer and config/scheduler (train.py passes them to the partial model)
