name: Deploy to GitHub Pages

# permissions:
#   contents: write
#   pages: write

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Python 3.10 matches the green CI environment. The 3.11+ notebook failure
      # ("argument of type 'function' is not iterable") was IPython 9 under
      # execnb 0.1.5; settings.ini dev_requirements now pins ipython<9.
      # fastgit<0.1 is pinned in settings.ini dev_requirements: newer releases need
      # fastcore>=1.12, which nbdev 2.3.x (fastcore==1.5.29) cannot use.
      - uses: fastai/workflows/quarto-ghp@master
        with:
          version: '3.10'
