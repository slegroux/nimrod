name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak
          python -m pip install --upgrade pip
          # nbdev toolchain (pinned) + torch stack + deps all come from .[dev];
          # CPU torch index keeps the runner from pulling CUDA wheels.
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Diagnostic Information
        run: |
          python -c "import torch; print('Torch version:', torch.__version__)"
          python -c "import torchvision; print('Torchvision version:', torchvision.__version__)"
          python -c "import os; print('Current working directory:', os.getcwd())"
          python -c "import sys; print('Python path:', sys.path)"

      - name: Clean notebooks
        run: |
          nbdev_clean

      - name: Export notebooks
        run: |
          nbdev_export

      - name: Check notebooks and exported modules are in sync
        run: |
          if ! git diff --exit-code; then
            echo "::error::nbdev_clean/nbdev_export changed tracked files. Run nbdev_clean && nbdev_export locally and commit the result."
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Check for orphan modules
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          pat = re.compile(r"AUTOGENERATED! DO NOT EDIT! File to edit: (\S+\.ipynb)")
          bad = []
          for py in sorted(pathlib.Path("nimrod").rglob("*.py")):
              head = "\n".join(py.read_text(errors="ignore").splitlines()[:5])
              m = pat.search(head)
              if m and not (py.parent / m.group(1)).resolve().exists():
                  bad.append(f"{py}: missing notebook {m.group(1)}")
          if bad:
              print("Orphan modules (source notebook missing):")
              print("\n".join(bad))
              sys.exit(1)
          print("No orphan modules.")
          EOF

      - name: Run tests
        run: |
          # Skip notebooks that can't run in CI:
          #   image.med          - vendored BLIP uses transformers internals removed upstream
          #   audio.datasets.stt - needs a LibriSpeech manifest that isn't in the repo
          #   audio.utils/features, models.aligners - decode audio via torchaudio.load,
          #     which on torch 2.9 needs torchcodec + a matching ffmpeg (CI doesn't ship it;
          #     the library code itself imports fine and is unaffected).
          # (default ^[_.] preserved so _*/.* notebooks stay skipped.)
          nbdev_test --do_print --timing \
            --skip_file_re '^[_.]|image\.med|audio\.datasets\.stt|audio\.utils|audio\.features|models\.aligners'