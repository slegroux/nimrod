; torch 2.9.x matrix: Blackwell-capable (DGX Spark/GB10 via cu130), Hopper (H100), and Apple MPS.
; torchtext removed (archived, unused by the code) — that lifted the torch 2.3 / numpy<2 pins.
; transformers kept <5: nimrod/image/med.py vendors BLIP and uses transformers internals 5.x removed.
; Core = what the library's core modules (utils, models.*, image.datasets, text.*, data.core, train.py)
; import at top level. wandb stays core because models/core.py and train.py import it unconditionally.
requirements = torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 numpy lightning torchmetrics tensorboard
    anyascii datasets einops hydra-core hydra_colorlog inflect matplotlib omegaconf pandas phonemizer pillow
    plum-dispatch python-dotenv requests rich six torch-lr-finder torchinfo tqdm
    transformers>=4.40,<5 wandb

; Optional stacks, installed as slg-nimrod[audio] etc. (setup.py reads every extras_* key; [all] = union).
extras_audio = lhotse librosa encodec ipython
extras_diffusion = diffusers accelerate
extras_image = timm fairscale ftfy
extras_tracking = hydra-optuna-sweeper livelossplot torchviz fastprogress

